name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-7.0.0-${{ runner.os }}

      - name: Install Emscripten
        run: |
          if [ ! -d "$RUNNER_TEMP/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          fi
          "$RUNNER_TEMP/emsdk/emsdk" install 7.0.0
          "$RUNNER_TEMP/emsdk/emsdk" activate 7.0.0
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$RUNNER_TEMP/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build the WebAssembly playground
        run: npm run wasm

      - name: Determine site URL and base path
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=$REPO_NAME" >> "$GITHUB_ENV"
          fi

      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
